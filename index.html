<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCH Executive Copilot Prompts</title>
<style>
  :root {
    --red: #F8001A;
    --slate: #141009;
    --grey: #6E6B68;
    --white: #FFFFFF;
    --light: #F5F4F3;
    --line: #E3E1DF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: var(--light);
    color: var(--slate);
    line-height: 1.5;
  }

  header {
    background: var(--white);
    border-bottom: 4px solid var(--red);
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .logo { height: 72px; width: auto; flex: none; }
  header h1 { margin: 0; font-size: 1.75rem; color: var(--slate); }
  header h1 span { color: var(--red); }
  header p { margin: 4px 0 0; color: var(--grey); }

  main { max-width: 960px; margin: 0 auto; padding: 24px; }

  .toolbar { display: flex; gap: 12px; margin-bottom: 16px; }
  .toolbar input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    color: var(--slate);
    background: var(--white);
  }
  .toolbar input:focus { outline: 2px solid var(--red); outline-offset: 1px; }
  .toolbar button {
    padding: 10px 16px;
    border: 1px solid var(--slate);
    background: var(--white);
    color: var(--slate);
    border-radius: 8px;
    font: inherit;
    cursor: pointer;
  }
  .toolbar button:hover { background: var(--slate); color: var(--white); }

  .section {
    background: var(--white);
    border: 1px solid var(--line);
    border-left: 6px solid var(--slate);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .section.open { border-left-color: var(--red); }

  .section-head {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    background: none;
    border: 0;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .section-head:hover { background: var(--light); }
  .section-head:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; }
  .num {
    flex: none;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--slate);
    color: var(--white);
    display: grid; place-items: center;
    font-weight: 700;
  }
  .section.open .num { background: var(--red); }
  .titles { flex: 1; min-width: 0; }
  .titles h2 { margin: 0; font-size: 1.15rem; color: var(--slate); }
  .app { font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--red); }
  .skills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .skill {
    font-size: .75rem;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--light);
    border: 1px solid var(--line);
    color: var(--slate);
  }
  .chev {
    flex: none;
    width: 10px; height: 10px;
    border-right: 3px solid var(--grey);
    border-bottom: 3px solid var(--grey);
    transform: rotate(45deg);
    transition: transform .2s;
    margin-right: 6px;
  }
  .section.open .chev { transform: rotate(-135deg); border-color: var(--red); }

  .section-body { display: none; padding: 4px 20px 20px; }
  .section.open .section-body { display: block; }

  .prompt {
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-top: 12px;
    background: var(--white);
  }
  .prompt-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 12px;
    background: var(--slate);
    color: var(--white);
    border-radius: 7px 7px 0 0;
    font-size: .85rem;
    font-weight: 600;
  }
  .copy {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 14px;
    border: 0;
    border-radius: 6px;
    background: var(--red);
    color: var(--white);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    min-width: 104px;
  }
  .copy:hover { background: #C40016; }
  .copy:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
  .copy.done { background: #2e8b46; }
  .prompt-text {
    margin: 0;
    padding: 14px 16px;
    white-space: pre-wrap;
    word-wrap: break-word;
    font: inherit;
    color: var(--slate);
  }
  .empty { display: none; text-align: center; color: var(--grey); padding: 32px; }

  footer { text-align: center; color: var(--grey); font-size: .8rem; padding: 24px; }

  @media (max-width: 600px) {
    .header-inner { flex-direction: column; text-align: center; }
    .toolbar { flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <img class="logo" id="logo" src="logo.png" alt="Coca-Cola HBC">
    <div>
      <h1>Executive Copilot <span>Prompts</span></h1>
      <p>Select a section, copy a prompt and paste it into Copilot. Replace the [bracketed] fields with your own details.</p>
    </div>
  </div>
</header>

<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search sections, skills or prompts" aria-label="Search">
    <button id="toggleAll" type="button">Expand all</button>
  </div>
  <div id="sections"></div>
  <p class="empty" id="empty">No matching prompts.</p>
</main>

<footer>Coca-Cola HBC</footer>

<script>
const SECTIONS = [
  {
    title: "Personalise Copilot",
    app: "Copilot Chat",
    skills: ["Custom instructions", "Defining role and priorities", "Setting tone and rules"],
    prompts: [
      { label: "Custom instructions",
        text: `I am [name], [role] at CCH. My responsibilities are [functions/markets]; my audiences are [board/ExCo/GMs/team].
My priorities are [current priority 1], [current priority 2] and [current priority 3]. The metrics I focus on are [metrics].
My decision lens is [customer impact/cash/growth/operations/people/risk]. Topics I want help with are [topics].
Help me prepare meetings, understand data, evaluate options and communicate. Lead with the decision, then evidence, uncertainty, option tradeoffs and the next step. Challenge unsupported assumptions respectfully.
Use concise British business English and short bullets. My tone is [direct/warm/formal/conversational] and detail level is [executive summary/one page/detailed]. Make currencies, units, periods and dates clear.
Distinguish facts, assumptions and proposals. Cite source titles and dates; say when information is missing or inaccessible. Ask one focused question if a material fact is missing. Draft for my review; do not send or schedule without my explicit instruction.` }
    ]
  },
  {
    title: "Prepare My Day",
    app: "Copilot Chat",
    skills: ["Grounding in calendar, email and files", "Prioritising", "Citing sources"],
    prompts: [
      { label: "Day brief",
        text: `I'm the [role] at CCH. I need to prepare for today using my accessible calendar, emails and files. Give me a short brief with meeting times in my local timezone, purpose, people, decisions needed and documents to read. Surface my three most important priorities, conflicts and unresolved requests. Cite source titles or messages and dates; distinguish invitations, proposals and confirmed decisions. Name access gaps. Answer here for my review without sending or scheduling anything.` }
    ]
  },
  {
    title: "Research a Topic",
    app: "Copilot Chat",
    skills: ["Source verification", "Separating fact from assumption", "Briefing"],
    prompts: [
      { label: "Five-minute research briefing",
        text: `I'm the [role] at CCH. I want a five-minute briefing on the CCH acquisition and the implications for [my function/market]. Verify the transaction status when I run this prompt, using dated official company and regulator sources. Distinguish agreed terms, conditional approval, expected completion and a confirmed closing announcement. Give me three relevant business questions and the key uncertainties. Cite titles, publishers, dates and URLs. Keep public research separate from approved internal material and do not assume permission for pre-close integration.` }
    ]
  },
  {
    title: "Excel: Understand the Business",
    app: "Excel",
    skills: ["Reading a data model", "Variance analysis", "Forming questions"],
    prompts: [
      { label: "Explore and choose a question",
        text: `I'm the [role] at CCH. I need to understand how the business is performing across [my CCH markets or segment: Established, Developing or Emerging]. Using the financial and supply-chain data I have open or paste here, without changing it, compare Actual with Budget and Prior Year for [period], checking that months, markets, scenarios and units line up. Highlight material revenue, comparable EBIT, cost and service variances, then suggest three questions I could investigate. I will choose [market/group], [period] and [my question]. Separate measured differences from possible causes; do not prescribe a recommendation before my analysis.` }
    ]
  },
  {
    title: "Excel: Build Your Analysis",
    app: "Excel",
    skills: ["Formula-driven analysis", "Weighted metrics", "Charts and EBIT bridges"],
    prompts: [
      { label: "Build the analysis",
        text: `I'm the [role] at CCH. I want to investigate [my question] for [market/group] over [period], comparing Actual with [Budget/Prior Year]. Build a formula-driven analysis in a new sheet and preserve the source data. Use tables, weighted metrics and one or two charts that answer my question. Show revenue and comparable EBIT variances, margin and relevant cost or service measures. If useful, add an EBIT bridge whose components reconcile to the total change. Check joins, filters, missing keys and zero denominators; keep formulas visible and label currencies, units and periods.` },
      { label: "Calculation rules",
        text: `For my analysis, calculate group margin as total comparable EBIT ÷ total net sales revenue, OTIF as total orders delivered on time and in full ÷ total orders due, and downtime rate as total unplanned downtime hours ÷ total scheduled production hours. Compare like months and scenarios. Calculate net sales revenue per unit case as revenue ÷ unit case volume, stating the currency and units. A revenue bridge may separate a volume effect from a combined price/mix residual, but must not split price and mix without SKU evidence. Treat inventory and receivables as month-end stocks, not amounts to sum across months. For a month, calculate DSO from receivables ÷ daily revenue using the number of days in that period. Do not invent FX movements or extrapolate untested savings.` }
    ]
  },
  {
    title: "Excel: Check and Communicate Findings",
    app: "Excel",
    skills: ["Reconciling to source", "Separating observation from hypothesis", "Decision questions"],
    prompts: [
      { label: "Checked ExCo update",
        text: `I'm the [role] at CCH. I need a concise ExCo update from my completed analysis. First reconcile the formulas, totals, comparison periods and chart sources to the source data, and flag discrepancies for me to resolve. Once I confirm the checks, draft three important findings, the questions still unanswered and proposed next checks or actions. Distinguish observations from hypotheses and show what could change my conclusion. Give me a paste-ready snapshot with period, units and source references for Word. Draft for my review; do not send it.` }
    ]
  },
  {
    title: "Word: Review the Evidence",
    app: "Word",
    skills: ["Critical review", "Spotting unsupported claims", "Targeted improvements"],
    prompts: [
      { label: "Challenge the operating review",
        text: `I'm the [role] at CCH. I need to review this open operating-performance review before editing it. Identify the performance questions, evidence, assumptions and gaps. Challenge any claim that goes beyond the data provided, especially causal explanations or recommendations. Give me five targeted improvements with section references. Ask for my verified analysis findings before changing figures or selecting actions.` }
    ]
  },
  {
    title: "Word: Revise the Review",
    app: "Word",
    skills: ["Editing in place", "Using verified data", "Concise reporting"],
    prompts: [
      { label: "Revise with checked analysis",
        text: `I'm the [role] at CCH. I want to revise this document in place into a concise 2-3-page operating-performance review for ExCo. Use my verified analysis, or the checked snapshot I provide; ask if it is missing. Cover the decision questions, group and market variances, cost and service observations, uncertainties, options to investigate and proposed functional next checks. Cite the data sources, units and period. Remove unsupported claims and explain any change in conclusion. Do not invent customer commitments, approved owners, deadlines or causes.` }
    ]
  },
  {
    title: "Word: Prepare the Leadership Update",
    app: "Word",
    skills: ["Executive summaries", "Leading with the issue", "Separating proposals from commitments"],
    prompts: [
      { label: "150-word summary and follow-up",
        text: `I'm the [role] at CCH. I need a 150-word leadership summary and a short functional follow-up draft from my revised operating review and verified analysis. Lead with the performance issue and the decision or investigation needed. Include the most material checked figures, open questions and proposed Finance, Supply Chain and market-leadership checks. Cite the review sections and data period. Keep proposed actions distinct from approved commitments. Return drafts for my review without sending or scheduling anything.` }
    ]
  },
  {
    title: "PowerPoint: Create the Deck",
    app: "PowerPoint",
    skills: ["Storyline design", "One message per slide", "Editable charts and source notes"],
    prompts: [
      { label: "Leadership deck",
        text: `I'm the [role] at CCH. I need to brief [board/ExCo] on market performance using my revised Word review and verified analysis. Create 6-7 slides covering group performance, market variances, cost and service, implications, options or questions, and proposed actions. Use the approved CCH template, one message per slide, editable charts, source notes and clear units. Use only checked figures and distinguish observations from unproven causes. Ask for any missing input before proceeding. Keep unresolved decisions visible and do not invent approvals or commitments.` }
    ]
  },
  {
    title: "Outlook: Summarise and Reply",
    app: "Outlook",
    skills: ["Thread summarisation", "Fast replies", "Not inferring agreement"],
    prompts: [
      { label: "Summarise the thread",
        text: `I'm the [role] at CCH. I need to understand this selected email thread. Summarise the issue, confirmed decisions, open questions, requested actions and stated owners or dates. Cite the message author and date for important points, distinguish proposals from commitments, and flag unreadable attachments. Do not infer agreement from silence.` },
      { label: "Two reply drafts",
        text: `I'm the [role] at CCH. I want two reply drafts based on the checked thread summary: one under 60 words and one under 120. Acknowledge the request, ask one necessary clarification and include only actions supported by the thread. Use concise professional language and avoid unsupported promises. Return the text for my review without sending.` }
    ]
  },
  {
    title: "Outlook: Write in Your Own Voice",
    app: "Outlook",
    skills: ["Style rules", "Authentic voice", "Drafting from checked material"],
    prompts: [
      { label: "Capture my style",
        text: `I want to make this reply sound like me. Use only the sent messages I have selected and provided. Identify observable features such as sentence length, greeting, directness and closing, then suggest four short style rules for me to approve or change. Rewrite the reply using the rules I approve. Do not infer a profile from other mail or copy confidential sample content into the reply.` },
      { label: "Performance review email",
        text: `I'm the [role] at CCH. I need an email draft to [audience] about the market-performance review. Use my revised Word review, verified analysis and the style rules I approved. Cover the issue, checked findings, questions, proposed next checks and the decision needed. Keep proposed functional responsibilities and timing subject to approval. Return draft text for my review without sending or scheduling anything.` }
    ]
  },
  {
    title: "Researcher: Deeper Acquisition Investigation",
    app: "Researcher",
    skills: ["Claim-evidence registers", "Source dating", "Public vs internal evidence"],
    prompts: [
      { label: "Evidence-based CCH acquisition study",
        text: `I'm the [role] at CCH. I need a deeper evidence-based study of the CCH acquisition and the implications for [my function/market], while protecting current operations. Declare the as-of date when I run this. First verify status from official company and regulator sources and search for a dated closing announcement. Distinguish agreed terms, conditional approval, expected completion and confirmed completion. Start with the sources below, check their dates and look for newer evidence. If closing evidence is not found, describe the search limitation rather than claiming definitively that closing has not occurred.

Build a claim-evidence register with claim, source title, publisher, date, URL or section, what is established and the unresolved gap. Separate public evidence from approved internal information, assumptions and proposals. Explain apparent contradictions and what would resolve them. Do not invent merger conditions, synergies, integration dates, financial commitments or personnel outcomes. Identify the Legal and governance questions that require qualified validation.

Give me a concise executive synthesis, the evidence register, five decision questions and a short research backlog relevant to my role. For internal context, use only the approved tenant documents I select, in a separate section with title, date and section references. Do not submit those documents to public search or share them with the acquirer. Focus on evidence and permitted readiness questions, not an assumed integration mandate.

Starting source: Coca-Cola HBC, Half Year 2026 CCH acquisition factsheet, acquisition terms/timeline. https://www.coca-colahellenic.com/content/dam/cch/us/documents/investors-and-financial/2026-half-year-results/coca-cola-hbc-hy-2026-ccba-factsheet.pdf
Starting source: Competition Tribunal, "Competition Tribunal Approves Coca-Cola Bottling Merger with Conditions", 11 September 2026. https://comptrib.co.za/info-library/press-room/Merger-Alert:-Tribunal-approves-Coca-Cola-bottling-merger-with-conditions;-and-CFAO-Mobility%E2%80%99s-acquisition-of-Morgenrood-Auto` }
    ]
  },
  {
    title: "Role Stretch: Challenge Your Analysis",
    app: "Copilot Chat",
    skills: ["Stress-testing conclusions", "Evidence vs governance questions", "Refining output"],
    prompts: [
      { label: "Challenge through my lens",
        text: `I'm the [role] at CCH. I want to challenge my market-performance analysis through [my chosen lens]. Ask one evidence question and one decision or governance question, then suggest one useful refinement to my verified output. Explain what evidence could change my conclusion. Use the role and preferences I provide, not assumptions about me.` }
    ]
  }
];

const container = document.getElementById("sections");
const search = document.getElementById("search");
const toggleAll = document.getElementById("toggleAll");
const empty = document.getElementById("empty");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (_) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (_) {}
    ta.remove();
    return ok;
  }
}

function render() {
  SECTIONS.forEach((s, i) => {
    const sec = el("section", "section");
    sec.dataset.search = [s.title, s.app, ...s.skills, ...s.prompts.map(p => p.label + " " + p.text)].join(" ").toLowerCase();

    const head = el("button", "section-head");
    head.type = "button";
    head.setAttribute("aria-expanded", "false");
    head.appendChild(el("span", "num", String(i + 1)));

    const titles = el("div", "titles");
    titles.appendChild(el("div", "app", s.app));
    titles.appendChild(el("h2", "", s.title));
    const skills = el("div", "skills");
    s.skills.forEach(k => skills.appendChild(el("span", "skill", k)));
    titles.appendChild(skills);
    head.appendChild(titles);
    head.appendChild(el("span", "chev"));

    const body = el("div", "section-body");
    s.prompts.forEach(p => {
      const box = el("div", "prompt");
      const bar = el("div", "prompt-bar");
      bar.appendChild(el("span", "", p.label));
      const btn = el("button", "copy", "Copy");
      btn.type = "button";
      btn.addEventListener("click", async () => {
        const ok = await copyText(p.text);
        btn.textContent = ok ? "Copied!" : "Press Ctrl+C";
        btn.classList.toggle("done", ok);
        setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("done"); }, 1800);
      });
      bar.appendChild(btn);
      box.appendChild(bar);
      box.appendChild(el("pre", "prompt-text", p.text));
      body.appendChild(box);
    });

    head.addEventListener("click", () => {
      setOpen(sec, !sec.classList.contains("open"));
      updateToggleLabel();
    });
    sec.append(head, body);
    container.appendChild(sec);
  });
}

function setOpen(sec, open) {
  sec.classList.toggle("open", open);
  sec.querySelector(".section-head").setAttribute("aria-expanded", String(open));
}

function visibleSections() {
  return [...container.children].filter(s => s.style.display !== "none");
}

function updateToggleLabel() {
  const vis = visibleSections();
  toggleAll.textContent = vis.length && vis.every(s => s.classList.contains("open")) ? "Collapse all" : "Expand all";
}

search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  let shown = 0;
  [...container.children].forEach(sec => {
    const match = !q || sec.dataset.search.includes(q);
    sec.style.display = match ? "" : "none";
    if (match) shown++;
    if (q && match) setOpen(sec, true);
  });
  empty.style.display = shown ? "none" : "block";
  updateToggleLabel();
});

toggleAll.addEventListener("click", () => {
  const vis = visibleSections();
  const open = !vis.every(s => s.classList.contains("open"));
  vis.forEach(s => setOpen(s, open));
  updateToggleLabel();
});

render();
</script>
</body>
</html>
